experiment:
  name: example_direction_factor_mining

scenario:
  raw: "Liquid asset 5-minute bars, predict next-bar direction."
  market: generic
  factor_type: timing
  target: direction
  frequency: 5min
  fields: [open, high, low, close, volume]

reward:
  primary: direction_accuracy
  components:
    direction_accuracy:
      weight: 1.0
      horizon: 1
      min_samples: 50

evaluation:
  backtest:
    symbol: ASSET
    start_date: "2024-01-01"
    end_date: "2024-02-01"
    bar_minutes: 5
    warmup_days: 10
    data:
      data_dir: data
      file_template: "{symbol_safe}_1m.parquet"
  reward:
    primary: direction_accuracy
    components:
      direction_accuracy:
        weight: 1.0
        horizon: 1
        min_samples: 50

seed:
  validation:
    max_nodes: 64
    max_depth: 12
  scoring:
    metric_weights:
      reward: 1.0
      coverage: 0.1
      complexity: -0.02
    hard_filters:
      min_coverage: 0.5
  library:
    elite_top_k: 10
    diverse_top_k: 20

task_bank:
  max_seeds: 16
  sort_metric: seed_score
  bar_minutes: 5
  scenario: "example single-asset direction task"
  time_splits:
    - name: split_1
      start_date: "2024-01-01"
      end_date: "2024-01-10"
    - name: split_2
      start_date: "2024-01-10"
      end_date: "2024-01-20"
    - name: split_3
      start_date: "2024-01-20"
      end_date: "2024-02-01"
